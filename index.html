<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasificador de productos para inventario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  #video, #foto { width: 100%; max-width: 448px; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: #222; }
  #foto { display: none; }
  .prob { height: 8px; }
  .seccion-badge { font-size: .8rem; }
</style>
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="h3 text-center mb-1">Clasificador de productos</h1>
  <p class="text-center text-muted mb-4">Apunta la cámara a un producto y añádelo al inventario</p>

  <div class="row g-4">
    <div class="col-lg-6 text-center">
      <video id="video" playsinline muted autoplay></video>
      <img id="foto" alt="Foto subida">
      <div class="mt-3 d-flex gap-2 justify-content-center flex-wrap">
        <button id="btnCamara" class="btn btn-outline-secondary btn-sm">Cambiar cámara</button>
        <label class="btn btn-outline-secondary btn-sm mb-0">Subir foto
          <input id="archivo" type="file" accept="image/*" hidden>
        </label>
        <button id="btnVolver" class="btn btn-outline-secondary btn-sm" style="display:none">Volver a la cámara</button>
      </div>
      <p id="estado" class="small text-muted mt-2 mb-0">Cargando modelo...</p>
      <p id="avisoCamara" class="small text-danger"></p>
    </div>

    <div class="col-lg-6">
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="text-muted small">Sección</div>
          <div id="seccion" class="h4 mb-1">—</div>
          <div class="text-muted small">Producto</div>
          <div id="producto" class="h2 mb-2">—</div>
          <div id="top3" class="small"></div>
          <button id="btnAnadir" class="btn btn-primary w-100 mt-3" disabled>Añadir al inventario</button>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0">Inventario <span id="total" class="badge bg-secondary">0</span></h2>
            <div class="d-flex gap-2">
              <button id="btnCsv" class="btn btn-success btn-sm">Descargar CSV</button>
              <button id="btnVaciar" class="btn btn-outline-danger btn-sm">Vaciar</button>
            </div>
          </div>
          <div id="inventario" class="small text-muted">Todavía no hay productos.</div>
        </div>
      </div>
    </div>
  </div>
  <p class="text-center text-muted small mt-4">Modelo MobileNetV2 entrenado con Freiburg Groceries + Grocery Store Dataset · <a href="prueba.html">Probar con fotos de ejemplo</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script>
const TAM = 224;
let modelo, clases, prediccionActual = null, usarFoto = false, camaraTrasera = true, stream = null;
let inventario = JSON.parse(localStorage.getItem('inventario') || '{}');
const $ = id => document.getElementById(id);

async function iniciarCamara() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: camaraTrasera ? 'environment' : 'user', width: 640, height: 640 } });
    $('video').srcObject = stream;
    $('avisoCamara').textContent = '';
  } catch (e) {
    $('avisoCamara').textContent = 'No se pudo abrir la cámara (' + e.name + '). Puedes usar "Subir foto".';
  }
}

function clasificar() {
  const fuente = usarFoto ? $('foto') : $('video');
  if (!usarFoto && fuente.readyState < 2) return null;
  return tf.tidy(() => {
    let img = tf.browser.fromPixels(fuente).toFloat();
    const [h, w] = img.shape, s = Math.min(h, w);
    img = img.slice([Math.floor((h - s) / 2), Math.floor((w - s) / 2), 0], [s, s, 3]);
    img = tf.image.resizeBilinear(img, [TAM, TAM]).expandDims(0);
    return Array.from(modelo.predict(img).dataSync());
  });
}

function mostrar(probs) {
  const orden = probs.map((p, i) => [p, i]).sort((a, b) => b[0] - a[0]).slice(0, 3);
  const [p, i] = orden[0];
  prediccionActual = clases[i];
  $('seccion').textContent = clases[i].seccion;
  $('producto').textContent = clases[i].producto;
  $('top3').innerHTML = orden.map(([p, i]) =>
    `<div class="d-flex justify-content-between"><span>${clases[i].producto} <span class="text-muted">(${clases[i].seccion})</span></span><span>${(p * 100).toFixed(0)}%</span></div>
     <div class="progress prob mb-1"><div class="progress-bar" style="width:${p * 100}%"></div></div>`).join('');
  $('btnAnadir').disabled = false;
}

function bucle() {
  if (!usarFoto) { const probs = clasificar(); if (probs) mostrar(probs); }
  setTimeout(bucle, 400);
}

function pintarInventario() {
  const claves = Object.keys(inventario);
  $('total').textContent = claves.reduce((a, k) => a + inventario[k].cantidad, 0);
  if (!claves.length) { $('inventario').innerHTML = 'Todavía no hay productos.'; return; }
  const porSeccion = {};
  claves.forEach(k => (porSeccion[inventario[k].seccion] ||= []).push(k));
  $('inventario').innerHTML = Object.keys(porSeccion).sort().map(s =>
    `<div class="fw-bold text-dark mt-2">${s}</div>` + porSeccion[s].sort().map(k =>
      `<div class="d-flex justify-content-between align-items-center border-bottom py-1 text-dark">
         <span>${inventario[k].producto}</span>
         <span><button class="btn btn-sm btn-light py-0" onclick="cambiar('${k}',-1)">−</button>
         <b class="mx-2">${inventario[k].cantidad}</b>
         <button class="btn btn-sm btn-light py-0" onclick="cambiar('${k}',1)">+</button></span>
       </div>`).join('')).join('');
}

function guardar() {
  localStorage.setItem('inventario', JSON.stringify(inventario));
  pintarInventario();
}

function cambiar(k, d) {
  inventario[k].cantidad += d;
  if (inventario[k].cantidad <= 0) delete inventario[k];
  guardar();
}

$('btnAnadir').onclick = () => {
  const c = prediccionActual, k = c.seccion + '|' + c.producto;
  inventario[k] ||= { seccion: c.seccion, producto: c.producto, cantidad: 0 };
  cambiar(k, 1);
};
$('btnVaciar').onclick = () => { if (confirm('¿Vaciar el inventario?')) { inventario = {}; guardar(); } };
$('btnCsv').onclick = () => {
  const filas = [['Sección', 'Producto', 'Cantidad'], ...Object.values(inventario).map(v => [v.seccion, v.producto, v.cantidad])];
  const csv = '\ufeff' + filas.map(f => f.map(x => `"${x}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'inventario.csv'; a.click();
};
$('btnCamara').onclick = () => { camaraTrasera = !camaraTrasera; iniciarCamara(); };
$('archivo').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  $('foto').onload = () => { usarFoto = true; $('foto').style.display = 'inline'; $('video').style.display = 'none';
    $('btnVolver').style.display = ''; mostrar(clasificar()); };
  $('foto').src = URL.createObjectURL(f);
};
$('btnVolver').onclick = () => { usarFoto = false; $('foto').style.display = 'none'; $('video').style.display = ''; $('btnVolver').style.display = 'none'; };

(async () => {
  pintarInventario();
  iniciarCamara();
  [modelo, clases] = await Promise.all([tf.loadLayersModel('./model.json'), fetch('./clases.json').then(r => r.json())]);
  tf.tidy(() => modelo.predict(tf.zeros([1, TAM, TAM, 3])));
  $('estado').textContent = 'Modelo cargado (' + clases.length + ' productos)';
  console.log('Modelo cargado');
  bucle();
})();
</script>
</body>
</html>
